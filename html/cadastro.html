<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - ONG Esperança</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <!-- Conteúdo do cadastro -->
    <main>
        <section class="container">
            <h2>Seja um colaborador</h2>

            <p>
                Preencha seus dados para participar das nossas iniciativas.
            </p>

            <form id="formulario-voluntario">
                <!-- Agrupamento dos dados do formulário -->
                <fieldset>
                    <legend>Dados para cadastro</legend>

                    <!-- Campo para nome completo -->
                    <div>
                        <label for="nome">Nome completo</label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            required
                        >
                    </div>

                    <!-- Campo para CPF -->
                    <div>
                        <label for="cpf">CPF</label>

                        <input
                            type="text"
                            id="cpf"
                            name="cpf"
                            required
                            pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                        >
                    </div>

                    <!-- Campo para telefone -->
                    <div>
                        <label for="telefone">Telefone</label>

                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            required
                            pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                        >
                    </div>

                    <!-- Campo para e-mail -->
                    <div>
                        <label for="email">E-mail</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                        >
                    </div>

                    <!-- Campo para CEP -->
                    <div>
                        <label for="cep">CEP</label>

                        <input
                            type="text"
                            id="cep"
                            name="cep"
                            required
                            pattern="[0-9]{5}-[0-9]{3}"
                        >
                    </div>
                </fieldset>

                <!-- Botão para envio do formulário -->
                <button type="submit">
                    Quero ser voluntário
                </button>
            </form>

            <!-- Toast -->
            <div
                class="toast"
                id="toast"
                role="status"
                aria-live="polite"
            >
                Cadastro realizado com sucesso!
            </div>
        </section>
    </main>
</body>
</html>
